<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarjeta - Distrito Wok Simón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --rojo:#C40F0F;
    --rojo-oscuro:#650303;
    --dorado:#E3B341;
    --dorado-claro:#F6DE9A;
    --dorado-oscuro:#B4842A;
    --crema:#FFF6E2;
    --amarillo:#F3C11A;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family:'Montserrat',Arial,Helvetica,sans-serif;
    background:#1a1a1a;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    gap:40px;
    padding:40px;
  }

  .label{
    color:#888;
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:-20px;
  }

  /* ===================== CARA FRONTAL ===================== */
  .cara-frontal{
    width:9cm;
    height:5cm;
    background:radial-gradient(120% 100% at 50% 0%, var(--rojo) 0%, var(--rojo-oscuro) 100%);
    border-radius:0.3cm;
    border:0.08cm solid var(--dorado);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
    padding:0.3cm 0.5cm;
    gap:0.02cm;
  }

  .cara-frontal::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 0.05cm, transparent 0.05cm 0.2cm);
    pointer-events:none;
  }

  .cara-frontal .marco-interno{
    position:absolute; inset:0.15cm;
    border:0.04cm solid var(--dorado);
    border-radius:0.15cm;
    pointer-events:none;
  }

  .cara-frontal .marca-nombre{
    color:var(--dorado-claro);
    font-weight:800;
    font-size:0.38cm;
    letter-spacing:0.1cm;
    text-transform:uppercase;
    text-shadow:0 0.03cm 0 var(--rojo-oscuro);
    position:relative;
    z-index:1;
  }

  .cara-frontal .logo-wok{
    width:2cm;
    height:1.8cm;
    position:relative;
    z-index:1;
    mix-blend-mode:screen;
    filter:drop-shadow(0 0.03cm rgba(0,0,0,0.3));
  }

  .cara-frontal .fila-arroces{
    display:flex;
    align-items:center;
    gap:0.15cm;
    position:relative;
    z-index:1;
  }

  .cara-frontal .plato-mini{
    width:0.7cm;
    height:0.7cm;
    border-radius:50%;
    border:0.02cm solid #E3B341;
    overflow:hidden;
    flex-shrink:0;
  }

  .cara-frontal .plato-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .cara-frontal .nombre-restaurante{
    color:var(--dorado-claro);
    font-weight:900;
    font-size:0.4cm;
    text-transform:uppercase;
    letter-spacing:0.06cm;
    text-shadow:0 0.04cm 0 var(--rojo-oscuro), 0 0.08cm 0.1cm rgba(0,0,0,0.4);
    position:relative;
    z-index:1;
  }

  .cara-frontal .sub-restaurante{
    background:linear-gradient(180deg,#FFFFFF 0%, #FFEBB2 45%, #FFD94D 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:900;
    font-size:0.5cm;
    text-transform:uppercase;
    letter-spacing:0.1cm;
    filter:drop-shadow(0 0.03cm 0 var(--rojo-oscuro));
    position:relative;
    z-index:1;
  }

  .cara-frontal .linea-deco{
    width:1.8cm; height:0.02cm;
    background:linear-gradient(90deg, transparent, var(--dorado), transparent);
    position:relative;
    z-index:1;
  }

  .cara-frontal .comida-rapida{
    color:var(--dorado-claro);
    font-size:0.2cm;
    font-weight:700;
    letter-spacing:0.04cm;
    position:relative;
    z-index:1;
  }

  .cara-frontal .frase-sabor{
    display:flex;
    align-items:center;
    gap:0.1cm;
    position:relative;
    z-index:1;
  }

  .cara-frontal .frase-sabor span{
    background:linear-gradient(180deg, #FFFFFF 0%, #FFEBB2 45%, #FFD94D 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:800;
    font-size:0.22cm;
    font-style:italic;
    letter-spacing:0.03cm;
  }

  .cara-frontal .estrellita{
    width:0.18cm; height:0.18cm;
    fill:var(--dorado);
  }

  /* ===================== CARA TRASERA ===================== */
  .cara-trasera{
    width:9cm;
    height:5cm;
    background:radial-gradient(120% 100% at 50% 0%, var(--rojo) 0%, var(--rojo-oscuro) 100%);
    border-radius:0.3cm;
    border:0.08cm solid var(--dorado);
    position:relative;
    display:flex;
    overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }

  .cara-trasera::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 0.05cm, transparent 0.05cm 0.2cm);
    pointer-events:none;
  }

  .cara-trasera .marco-interno{
    position:absolute; inset:0.15cm;
    border:0.04cm solid var(--dorado);
    border-radius:0.15cm;
    pointer-events:none;
  }

  .cara-trasera .info-izq{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0.3cm 0.4cm;
    position:relative;
    z-index:1;
  }

  .cara-trasera .info-item{
    display:flex;
    align-items:flex-start;
    gap:0.12cm;
    margin-bottom:0.2cm;
  }

  .cara-trasera .info-item:last-child{ margin-bottom:0; }

  .cara-trasera .icono-info{
    width:0.25cm; height:0.25cm;
    fill:var(--dorado);
    flex-shrink:0;
    margin-top:0.02cm;
  }

  .cara-trasera .texto-info{
    color:var(--crema);
    font-size:0.2cm;
    font-weight:600;
    line-height:1.4;
  }

  .cara-trasera .telefono-info{
    color:var(--dorado-claro);
    font-size:0.28cm;
    font-weight:800;
    letter-spacing:0.02cm;
  }

  .cara-trasera .separator{
    width:0.03cm;
    height:3cm;
    background:var(--dorado);
    margin:0 0.15cm;
    align-self:center;
    opacity:0.5;
  }

  .cara-trasera .qr-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:0.3cm;
    position:relative;
    z-index:1;
  }

  .cara-trasera #qrcode{
    background:#fff;
    padding:0.1cm;
    border-radius:0.08cm;
  }

  .cara-trasera .qr-texto{
    color:var(--dorado-claro);
    font-size:0.16cm;
    font-weight:700;
    letter-spacing:0.02cm;
    margin-top:0.08cm;
    text-transform:uppercase;
  }

</style>
</head>
<body>

<div class="label">Cara Frontal</div>
<div class="cara-frontal">
  <div class="marco-interno"></div>
  <div class="marca-nombre">Distrito Wok Simón</div>
  
  <img class="logo-wok" src="logo_restaurante.png" alt="Logo Distrito Wok Simón">
  
  <div class="fila-arroces">
    <div class="plato-mini"><img src="https://images.pexels.com/photos/35228295/pexels-photo-35228295.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop" alt="Arroz"></div>
    <div class="nombre-restaurante">Restaurante de Arroz</div>
    <div class="plato-mini"><img src="https://images.pexels.com/photos/28573375/pexels-photo-28573375.jpeg?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop" alt="Arroz"></div>
  </div>
  <div class="sub-restaurante">Chino</div>
  <div class="linea-deco"></div>
  <div class="comida-rapida">+ Comida Rápida</div>
  <div class="frase-sabor">
    <svg class="estrellita" viewBox="0 0 40 40"><path d="M20 2 L24.5 15.5 L38 20 L24.5 24.5 L20 38 L15.5 24.5 L2 20 L15.5 15.5 Z"/></svg>
    <span>Sabor que enamora</span>
    <svg class="estrellita" viewBox="0 0 40 40"><path d="M20 2 L24.5 15.5 L38 20 L24.5 24.5 L20 38 L15.5 24.5 L2 20 L15.5 15.5 Z"/></svg>
  </div>
</div>

<div class="label">Cara Trasera</div>
<div class="cara-trasera">
  <div class="marco-interno"></div>
  <div class="info-izq">
    <div class="info-item">
      <svg class="icono-info" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      <span class="texto-info">Calle 19 # 4D-34<br>Local 2 - Barrio Simón Bolívar</span>
    </div>
    <div class="info-item">
      <svg class="icono-info" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      <span class="telefono-info">+57 324 265 8227</span>
    </div>
    <div class="info-item">
      <svg class="icono-info" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
      <span class="texto-info">Arroces: 10:00 AM - 9:00 PM<br>Comida Rápida: 6:00 PM - 11:00 PM</span>
    </div>
  </div>
  <div class="separator"></div>
  <div class="qr-area">
    <div id="qrcode"></div>
    <div class="qr-texto">Escanea el menú</div>
  </div>
</div>

<script>
  const targetUrl = "https://drive.google.com/file/d/15ZHIdAnpwEczuqgIzaaWWTzKWDjFaEAD/view";
  new QRCode(document.getElementById("qrcode"), {
    text: targetUrl,
    width: 100,
    height: 100,
    colorDark: "#111111",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>

</body>
</html>
