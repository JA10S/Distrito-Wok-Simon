<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>QR - Distrito Wok Simón</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    font-family: 'Georgia', serif;
    color: #f5e6c8;
    padding: 40px 20px;
    box-sizing: border-box;
  }
  .card {
    background: #1a1a1a;
    border: 4px solid #c9a24b;
    border-radius: 16px;
    padding: 32px 40px;
    text-align: center;
    box-shadow: 0 0 30px rgba(201,162,75,0.25);
  }
  h1 {
    color: #d64545;
    letter-spacing: 2px;
    font-size: 22px;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  p.sub {
    color: #c9a24b;
    font-size: 13px;
    letter-spacing: 3px;
    margin: 0 0 24px;
  }
  #qrcode {
    background: #fff;
    padding: 16px;
    border-radius: 8px;
    display: inline-block;
  }
  a.download {
    display: inline-block;
    margin-top: 20px;
    color: #111;
    background: #c9a24b;
    padding: 10px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .url {
    margin-top: 16px;
    font-size: 11px;
    color: #888;
    word-break: break-all;
    max-width: 280px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Distrito Wok Simón</h1>
    <p class="sub">Escanea para ver el menú</p>
    <div id="qrcode"></div>
    <div class="url">https://drive.google.com/file/d/15ZHIdAnpwEczuqgIzaaWWTzKWDjFaEAD/view</div>
    <br>
    <a class="download" id="downloadBtn" href="#">Descargar QR (PNG)</a>
  </div>

<script>
  const targetUrl = "https://drive.google.com/file/d/15ZHIdAnpwEczuqgIzaaWWTzKWDjFaEAD/view";

  new QRCode(document.getElementById("qrcode"), {
    text: targetUrl,
    width: 240,
    height: 240,
    colorDark: "#111111",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  // Wire up download once canvas is rendered
  setTimeout(() => {
    const canvas = document.querySelector("#qrcode canvas");
    if (canvas) {
      document.getElementById("downloadBtn").href = canvas.toDataURL("image/png");
      document.getElementById("downloadBtn").download = "qr_distrito_wok_simon.png";
    }
  }, 300);
</script>
</body>
</html>
